# XcodeGen spec — CI runs `xcodegen generate` to create RepTrack.xcodeproj from this file.
# Never edit a generated .xcodeproj by hand; change this file instead.
name: RepTrack

options:
  bundleIdPrefix: io.github.domantastech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  RepTrack:
    type: application
    platform: iOS
    sources:
      - path: RepTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.domantastech.reptrack
        PRODUCT_NAME: RepTrack
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RepTrack
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

  RepTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RepTrackTests
    dependencies:
      - target: RepTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.domantastech.reptrack.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RepTrack.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RepTrack"
        BUNDLE_LOADER: "$(TEST_HOST)"

  RepTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RepTrackUITests
    dependencies:
      - target: RepTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.domantastech.reptrack.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RepTrack

schemes:
  RepTrack:
    build:
      targets:
        RepTrack: all
        RepTrackTests: [test]
        RepTrackUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RepTrackTests
        - RepTrackUITests
    archive:
      config: Release
